<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bingo el Chamo Navideño</title>
    <meta name="description" content="Plataforma de Bingo con Lobby interactivo, muñecos animados, tienda de personajes, Tops semanales, tómbola esférica de malla, sistema de cantada y pausa de juego con anuncio global a todos los jugadores, confeti festivo, detección de oportunidad de ganancia a tiempo/pasada, y notificaciones toast no invasivas." />
    <meta property="og:title" content="Bingo el Chamo Navideño" />
    <meta property="og:description" content="Plataforma de Bingo con Lobby interactivo, muñecos animados, tienda de personajes, Tops semanales, tómbola esférica de malla, sistema de cantada y pausa de juego con anuncio global a todos los jugadores, confeti festivo, detección de oportunidad de ganancia a tiempo/pasada, y notificaciones toast no invasivas." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/jpeg" href="./conejito_logo.jpg" />
    <meta property="og:image" content="./conejito_logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <style>
      html, body {
        background-color: #020617;
        color: #f1f5f9;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #chamo-boot-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        background: radial-gradient(circle at top, #1e1b4b 0%, #020617 70%);
      }
      #chamo-boot-loader .spinner {
        width: 44px;
        height: 44px;
        border: 4px solid rgba(250, 204, 21, 0.2);
        border-top-color: #facc15;
        border-radius: 50%;
        animation: chamoSpin 0.9s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes chamoSpin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      (function () {
        // 1. Protect localStorage on WebViews with disabled DOM storage or file:// SecurityError
        try {
          var testKey = '__chamo_ls_test__';
          window.localStorage.setItem(testKey, '1');
          window.localStorage.removeItem(testKey);
        } catch (lsErr) {
          try {
            var memStore = {};
            Object.defineProperty(window, 'localStorage', {
              configurable: true,
              value: {
                getItem: function (k) { return Object.prototype.hasOwnProperty.call(memStore, k) ? memStore[k] : null; },
                setItem: function (k, v) { memStore[k] = String(v); },
                removeItem: function (k) { delete memStore[k]; },
                clear: function () { memStore = {}; },
                key: function (i) { return Object.keys(memStore)[i] || null; },
                get length() { return Object.keys(memStore).length; }
              }
            });
          } catch (defErr) {}
        }

        // 2. Capture any startup errors or timeouts so the spinner never gets stuck silently
        var lastBootErr = '';
        function showBootError(msg) {
          if (msg) lastBootErr = String(msg);
          var root = document.getElementById('root');
          if (!root) return;
          if (root.getAttribute('data-mounted') === 'true') return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#020617;color:#f1f5f9;font-family:sans-serif;text-align:center;">' +
              '<div style="max-width:400px;width:100%;background:#0f172a;border:2px solid rgba(245,158,11,0.5);border-radius:20px;padding:24px;">' +
                '<div style="font-size:36px;margin-bottom:8px;">🤠</div>' +
                '<h2 style="margin:0 0 8px;color:#fcd34d;font-size:20px;">Bingo el Chamo</h2>' +
                '<p style="margin:0 0 14px;color:#cbd5e1;font-size:13px;line-height:1.5;">No se pudo iniciar correctamente en este navegador WebView.</p>' +
                '<p style="margin:0 0 16px;color:#f87171;font-size:11px;word-break:break-word;background:#020617;padding:8px;border-radius:8px;">' + String(lastBootErr || 'Tiempo de espera agotado al iniciar el script') + '</p>' +
                '<button onclick="window.location.reload()" style="width:100%;padding:12px 16px;border:none;border-radius:12px;background:#f59e0b;color:#020617;font-weight:700;font-size:14px;cursor:pointer;">Reintentar</button>' +
              '</div>' +
            '</div>';
        }
        window.__CHAMO_SHOW_BOOT_ERROR__ = showBootError;
        window.addEventListener('error', function (e) {
          if (e && (e.message || e.error)) {
            showBootError(e.message || (e.error && e.error.message) || 'Error de script');
          }
        });
        window.addEventListener('unhandledrejection', function (e) {
          if (e && e.reason) showBootError(e.reason.message || String(e.reason));
        });
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.getAttribute('data-mounted') !== 'true') {
            showBootError(lastBootErr || 'El visor WebView tardó demasiado o bloqueó el arranque.');
          }
        }, 10000);
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root">
      <div id="chamo-boot-loader">
        <div class="spinner"></div>
        <div style="font-size:20px;font-weight:700;color:#fde047;margin-bottom:6px;">Bingo el Chamo Navideño</div>
        <div style="font-size:13px;color:#94a3b8;">Cargando sala de juego...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
